name: Deploy to salesforceleetcode org

on:
  push:
    branches:
      - main
    paths:
      - 'force-app/**'

jobs:
  Deploy-to-salesforceleetcode-environment:
    runs-on: ubuntu-latest
    environment: salesforceleetcode

    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Install Salesforce CLI
      - name: Install sfdx
        run: npm install --global @salesforce/cli

      - name: Installing sfdx git delta
        run: |
          echo Y | sf plugins install sfdx-git-delta
          sfdx plugins

      - name: 'Create delta packages'
        run: | 
            mkdir changed-sources
            sf sgd source delta --to "HEAD" --from "HEAD~1" -o changed-sources/ -s force-app/ --generate-delta
            
            # KOPIUJEMY sfdx-project.json DO ŚRODKA DELTY
            # To sprawi, że folder 'changed-sources' stanie się "legalnym" projektem SFDX
            cp sfdx-project.json changed-sources/
            
            echo "[INFO] Folder structure for deploy:"
            ls -R changed-sources

      - name: 'Deploy to environment'
        run: |
            echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
            sf org login jwt --username ${{ secrets.DEPLOYMENT_USER_NAME }} --jwt-key-file server.key --client-id ${{ secrets.CONSUMER_KEY }} --instance-url ${{ vars.INSTANCE_URL }} --set-default
            
            # WCHODZIMY DO FORDERA DELTY I STAMTĄD ODPALAMY DEPLOY
            # Dzięki temu CLI widzi sfdx-project.json w tym samym folderze i nie marudzi
            cd changed-sources
            sf project deploy start \
              --source-dir force-app \
              --target-org ${{ secrets.DEPLOYMENT_USER_NAME }} \
              --test-level RunLocalTests
