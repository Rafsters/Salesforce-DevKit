name: Deploy to salesforceleetcode org

on:
  push:
    branches:
      - main
    paths:
      - 'force-app/**'

jobs:
  Deploy-to-salesforceleetcode-environment:
    runs-on: ubuntu-latest
    environment: salesforceleetcode

    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Install Salesforce CLI
      - name: Install sfdx
        run: npm install --global @salesforce/cli

      - name: Installing sfdx git delta
        run: |
          echo Y | sf plugins install sfdx-git-delta
          sfdx plugins

      - name: 'Create delta packages'
        run: | 
            mkdir changed-sources
            # Generujemy deltę
            sf sgd source delta --to "HEAD" --from "HEAD~1" --output changed-sources/ --generate-delta --source force-app/
            
            # KLUCZOWY MOMENT: Kopiujemy plik projektu do folderu z deltą
            # Bez tego sf project deploy start wypluje "NothingToDeploy"
            cp sfdx-project.json changed-sources/
            
      - name: 'Deploy to environment'
        run: |
            echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
            
            sf org login jwt \
              --username ${{ secrets.DEPLOYMENT_USER_NAME }} \
              --jwt-key-file server.key \
              --client-id ${{ secrets.CONSUMER_KEY }} \
              --instance-url ${{ vars.INSTANCE_URL }} \
              --set-default
            
            # Odpalamy deploy wskazując na folder, który teraz udaje poprawny projekt
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --test-level RunLocalTests
