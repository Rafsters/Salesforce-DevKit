name: Deploy to salesforceleetcode org

on:
  push:
    branches:
      - main
    paths:
      - 'force-app/**'

jobs:
  Deploy-to-salesforceleetcode-environment:
    runs-on: ubuntu-latest
    environment: salesforceleetcode

    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Install Salesforce CLI
      - name: Install sfdx
        run: npm install --global @salesforce/cli

      - name: Installing sfdx git delta
        run: |
          echo Y | sf plugins install sfdx-git-delta
          sfdx plugins

      - name: 'Create delta packages'
        run: | 
            mkdir changed-sources
            # Używamy nowych flag -o oraz -s zgodnie z logiem
            sf sgd source delta --to "HEAD" --from "HEAD~1" -o changed-sources/ -s force-app/ --generate-delta
            echo "[INFO] Diff generated"
            # Sprawdźmy dla pewności czy manifest istnieje
            ls -R changed-sources/package
                
      - name: 'Deploy to environment'
        run: |
            echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
            sf org login jwt --username ${{ secrets.DEPLOYMENT_USER_NAME }} --jwt-key-file server.key --client-id ${{ secrets.CONSUMER_KEY }} --instance-url ${{ vars.INSTANCE_URL }} --set-default
            
            # Zmieniamy --source-dir na --manifest
            # To sprawi, że CLI weźmie listę plików z delty, ale dopasuje je do plików w Twoim repo
            sf project deploy start \
              --manifest changed-sources/package/package.xml \
              --test-level RunLocalTests
